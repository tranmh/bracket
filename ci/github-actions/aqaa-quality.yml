# The safety net of bracket, written by aqaa from what its QA run found:
# unit tests with coverage and its floor, integration tests against the databases they need, end-to-end tests,
# lint, SAST and dependency audits (report only until the findings are triaged; SARIF goes to code scanning).
# Actions are pinned to commit SHAs (the comment names the release); jobs get read-only tokens.
name: aqaa quality
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit-nextjs-docs:
    name: Unit tests (nextjs docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          corepack enable
          yarn install --frozen-lockfile
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - name: Unit tests
        run: npx vitest run --coverage --coverage.reporter=cobertura --coverage.reportsDirectory=test-reports/coverage --reporter=default --reporter=junit --outputFile.junit=test-reports/unit.xml --exclude '**/*.integration.test.*' --exclude 'e2e/**'
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-nextjs-docs
          path: docs/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-nextjs-docs:
    name: Static analysis (nextjs docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          corepack enable
          yarn install --frozen-lockfile
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - name: eslint (lint, report only)
        run: if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then npx eslint .; else echo 'no ESLint configuration'; fi
        continue-on-error: true
      - name: tsc (lint, report only)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
  unit-nextjs-frontend:
    name: Unit tests (nextjs frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          corepack enable
          yarn install --frozen-lockfile
          npm install --no-save --no-audit --no-fund jest-junit@17.0.0
      - name: Unit tests
        run: JEST_JUNIT_OUTPUT_DIR=test-reports JEST_JUNIT_OUTPUT_NAME=unit.xml npx jest --ci --coverage --coverageReporters=cobertura --coverageDirectory=test-reports/coverage --reporters=default --reporters=jest-junit --testPathIgnorePatterns integration e2e
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-nextjs-frontend
          path: frontend/test-reports
          if-no-files-found: ignore
          retention-days: 14
  e2e-nextjs-frontend:
    name: End-to-end tests (nextjs frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          corepack enable
          yarn install --frozen-lockfile
          npm install --no-save --no-audit --no-fund jest-junit@17.0.0
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-reports/e2e.xml npx playwright test --reporter=junit,list
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nextjs-frontend
          path: frontend/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-nextjs-frontend:
    name: Static analysis (nextjs frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
