      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          corepack enable
          yarn install --frozen-lockfile
          npm install --no-save --no-audit --no-fund jest-junit@17.0.0
      - name: eslint (lint, report only)
        run: if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then npx eslint .; else echo 'no ESLint configuration'; fi
        continue-on-error: true
      - name: tsc (lint, report only)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
  unit-node-standalone-electron:
    name: Unit tests (node standalone/electron)
