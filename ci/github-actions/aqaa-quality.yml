    name: Integration tests (python backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqaa
          POSTGRES_PASSWORD: aqaa
          POSTGRES_DB: aqaa
        ports: ['5432:5432']
        options: "--health-cmd \"pg_isready -U aqaa -d aqaa\" --health-interval 2s --health-timeout 5s --health-retries 30"
    env:
      AQAA_PG_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_CONNECTION_STRING: Host=localhost;Port=5432;Database=aqaa;Username=aqaa;Password=aqaa
      DATABASE_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_SQLITE_PATH: /tmp/aqaa.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          . .venv-ci/bin/activate
          mkdir -p test-reports
          python -m venv .venv-ci
          . .venv-ci/bin/activate && python -m pip install --upgrade pip
          . .venv-ci/bin/activate && if [ -f pyproject.toml ]; then pip install -e '.[test,dev]' || pip install -e .; fi
          . .venv-ci/bin/activate && for f in requirements*.txt; do if [ -f "$f" ]; then pip install -r "$f"; fi; done
          . .venv-ci/bin/activate && pip install pytest==9.1.1 pytest-cov==7.1.0 ruff==0.17.2 'bandit[sarif]==1.9.4' pip-audit==2.10.1
      - name: Integration tests
        run: |-
          . .venv-ci/bin/activate
          python -m pytest -q -m integration --junitxml=test-reports/integration.xml || { rc=$?; [ "$rc" -eq 5 ] || exit "$rc"; }
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-python-backend
          path: backend/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-python-backend:
    name: Static analysis (python backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
